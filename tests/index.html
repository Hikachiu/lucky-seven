<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucky Seven Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
    .ok { color: #1f8a4c; } .fail { color: #c8102e; font-weight: 700; }
    pre { white-space: pre-wrap; margin: 2px 0 8px 24px; color: #555; }
  </style>
</head>
<body>
  <h1 id="summary">テスト実行中…</h1>
  <div id="out"></div>
  <script src="../data/loto7-data.js"></script>
  <script src="../src/engine.js"></script>
  <script src="engine.test.js"></script>
  <script>
    const r = window.TEST_RESULTS;
    const failed = r.filter((x) => !x.ok).length;
    document.getElementById("summary").textContent = `${r.length - failed}/${r.length} passed`;
    document.getElementById("summary").className = failed ? "fail" : "ok";
    document.getElementById("out").innerHTML = r.map((x) =>
      `<div class="${x.ok ? "ok" : "fail"}">${x.ok ? "✓" : "✗"} ${x.name}</div>${x.ok ? "" : `<pre>${x.err.replace(/</g, "&lt;")}</pre>`}`).join("");
  </script>
</body>
</html>
